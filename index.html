<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Puttikan Ruekraisri</title>

<style>

/* =========================================================
   PREMIUM SPACE PORTFOLIO
   Blue • Violet • Cyan • Glass • Glow • Anatomy
========================================================= */

:root{
    --deep:#070722;
    --deep-2:#0a0a2e;
    --indigo:#141446;
    --violet-dark:#24165c;
    --violet:#3d2b8c;
    --purple:#6c5ce7;
    --purple-light:#7b6ff0;
    --blue:#4facfe;
    --cyan:#62d8ff;
    --lavender:#a78bfa;

    --white:#f8f8ff;
    --text:#f3f4ff;
    --soft:#d8daf2;
    --muted:#a7acce;

    --glass:rgba(17,17,63,.52);
    --glass-strong:rgba(15,15,57,.70);

    --ease:cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Tahoma,
        Arial,
        sans-serif;

    color:var(--text);
    overflow:hidden;

    background:
        radial-gradient(
            circle at 12% 15%,
            rgba(108,92,231,.20),
            transparent 25%
        ),
        radial-gradient(
            circle at 88% 18%,
            rgba(79,172,254,.16),
            transparent 28%
        ),
        radial-gradient(
            circle at 75% 85%,
            rgba(167,139,250,.13),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #05051d 0%,
            #0a0a2e 42%,
            #11113b 72%,
            #090927 100%
        );
}


/* =========================================================
   DEEP BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:-15%;

    background:
        radial-gradient(
            ellipse at 25% 35%,
            rgba(61,43,140,.28),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 78% 60%,
            rgba(79,172,254,.16),
            transparent 34%
        ),
        radial-gradient(
            ellipse at 55% 5%,
            rgba(108,92,231,.16),
            transparent 28%
        );

    filter:blur(55px);
    opacity:.95;

    animation:
        nebulaDrift 28s ease-in-out infinite alternate;

    pointer-events:none;
    z-index:0;
}


/* =========================================================
   SPACE GRID
========================================================= */

body::after{
    content:"";
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(
            rgba(130,130,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(130,130,255,.035) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.8),
            transparent 85%
        );

    pointer-events:none;
    z-index:0;
}


/* =========================================================
   BACKGROUND AURORA
========================================================= */

.background-shape{
    position:fixed;
    border-radius:50%;

    pointer-events:none;
    z-index:0;

    filter:blur(30px);
}

.shape-1{
    width:420px;
    height:420px;

    top:-190px;
    left:-150px;

    background:
        radial-gradient(
            circle,
            rgba(108,92,231,.32),
            rgba(108,92,231,.04) 55%,
            transparent 72%
        );

    animation:
        floatOne 18s ease-in-out infinite alternate;
}

.shape-2{
    width:470px;
    height:470px;

    right:-210px;
    bottom:-190px;

    background:
        radial-gradient(
            circle,
            rgba(79,172,254,.24),
            rgba(79,172,254,.035) 55%,
            transparent 72%
        );

    animation:
        floatTwo 22s ease-in-out infinite alternate;
}

.shape-3{
    width:240px;
    height:240px;

    right:23%;
    top:5%;

    background:
        radial-gradient(
            circle,
            rgba(167,139,250,.20),
            transparent 70%
        );

    filter:blur(22px);

    animation:
        floatThree 15s ease-in-out infinite alternate;
}


/* =========================================================
   STAR FIELD
========================================================= */

.star-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
}

.star{
    position:absolute;
    width:3px;
    height:3px;

    border-radius:50%;

    background:#dfeaff;

    box-shadow:
        0 0 8px rgba(98,216,255,.75),
        0 0 18px rgba(123,111,240,.35);

    opacity:.35;

    animation:
        starTwinkle 4s ease-in-out infinite;
}

.star:nth-child(1){
    left:8%;
    top:15%;
    width:2px;
    height:2px;
    animation-delay:-1s;
}

.star:nth-child(2){
    left:17%;
    top:72%;
    width:4px;
    height:4px;
    animation-delay:-2.5s;
}

.star:nth-child(3){
    left:31%;
    top:10%;
    width:2px;
    height:2px;
    animation-delay:-.5s;
}

.star:nth-child(4){
    left:44%;
    top:78%;
    width:3px;
    height:3px;
    animation-delay:-3s;
}

.star:nth-child(5){
    left:58%;
    top:19%;
    width:4px;
    height:4px;
    animation-delay:-1.8s;
}

.star:nth-child(6){
    left:69%;
    top:65%;
    width:2px;
    height:2px;
    animation-delay:-2.2s;
}

.star:nth-child(7){
    left:82%;
    top:13%;
    width:3px;
    height:3px;
    animation-delay:-3.5s;
}

.star:nth-child(8){
    left:91%;
    top:48%;
    width:4px;
    height:4px;
    animation-delay:-.8s;
}

.star:nth-child(9){
    left:74%;
    top:88%;
    width:2px;
    height:2px;
    animation-delay:-1.4s;
}

.star:nth-child(10){
    left:38%;
    top:46%;
    width:3px;
    height:3px;
    animation-delay:-2.8s;
}


/* =========================================================
   FEATURE STARS
========================================================= */

.feature-star{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.95),
        0 0 22px rgba(98,216,255,.75),
        0 0 42px rgba(108,92,231,.55);

    opacity:.75;

    pointer-events:none;
    z-index:1;

    animation:
        featureTwinkle 5s ease-in-out infinite;
}

.feature-star::before,
.feature-star::after{
    content:"";
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.85),
        transparent
    );
}

.feature-star::before{
    width:34px;
    height:1px;
}

.feature-star::after{
    width:1px;
    height:34px;

    background:linear-gradient(
        180deg,
        transparent,
        rgba(255,255,255,.85),
        transparent
    );
}

.feature-star.star-one{
    top:13%;
    left:12%;
}

.feature-star.star-two{
    top:22%;
    right:12%;
    transform:scale(.75);
    animation-delay:-2s;
}

.feature-star.star-three{
    bottom:17%;
    left:24%;
    transform:scale(.62);
    animation-delay:-3.2s;
}

.feature-star.star-four{
    bottom:11%;
    right:20%;
    transform:scale(.82);
    animation-delay:-1.4s;
}


/* =========================================================
   CONSTELLATION
========================================================= */

.constellation{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
    z-index:1;

    opacity:.34;
}

.constellation path{
    fill:none;

    stroke:
        rgba(126,215,255,.55);

    stroke-width:1;

    stroke-dasharray:4 9;

    animation:
        constellationFlow 18s linear infinite;
}

.constellation circle{
    fill:#c8edff;

    opacity:.75;

    filter:
        drop-shadow(
            0 0 5px rgba(98,216,255,.9)
        );
}


/* =========================================================
   SHOOTING STARS
========================================================= */

.shooting-star{
    position:fixed;

    width:130px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(98,216,255,.05),
            rgba(255,255,255,.9)
        );

    transform:rotate(-32deg);

    opacity:0;

    pointer-events:none;
    z-index:1;

    animation:
        shootingStar 13s linear infinite;
}

.shooting-star::after{
    content:"";

    position:absolute;
    right:0;
    top:50%;

    width:4px;
    height:4px;

    border-radius:50%;

    background:white;

    transform:translateY(-50%);

    box-shadow:
        0 0 10px #fff,
        0 0 25px rgba(79,172,254,.8);
}

.shooting-star.one{
    top:18%;
    left:-15%;
}

.shooting-star.two{
    top:62%;
    left:-20%;

    animation-delay:7s;
}


/* =========================================================
   ANATOMY LINE ART
========================================================= */

.anatomy-art{
    position:absolute;

    width:430px;
    height:620px;

    right:-150px;
    top:50%;

    transform:
        translateY(-50%)
        rotate(7deg);

    opacity:.065;

    pointer-events:none;
    z-index:0;

    filter:
        drop-shadow(
            0 0 18px rgba(98,216,255,.4)
        );
}

.anatomy-art path,
.anatomy-art circle{
    fill:none;

    stroke:
        rgba(142,218,255,.95);

    stroke-width:1.4;

    stroke-linecap:round;

    vector-effect:non-scaling-stroke;
}

.anatomy-art .muscle{
    stroke:
        rgba(167,139,250,.85);

    stroke-width:2;
}

.anatomy-art .fiber{
    stroke:
        rgba(98,216,255,.7);

    stroke-width:.8;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    position:relative;
    z-index:2;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    width:min(1120px,100%);

    display:grid;

    grid-template-columns:.85fr 1.15fr;

    gap:70px;

    align-items:center;

    position:relative;
}


/* =========================================================
   VISUAL AREA
========================================================= */

.visual-area{
    position:relative;

    width:min(370px,82vw);

    margin:auto;

    perspective:1200px;
}


/* =========================================================
   ORBIT RINGS
========================================================= */

.visual-area::before,
.visual-area::after{
    content:"";

    position:absolute;

    border-radius:50%;

    pointer-events:none;

    z-index:-1;
}

.visual-area::before{
    width:125%;
    height:80%;

    left:-12%;
    top:10%;

    border:
        1px solid rgba(108,92,231,.25);

    transform:rotate(-28deg);

    box-shadow:
        0 0 30px rgba(108,92,231,.08);

    animation:
        ringRotate 24s linear infinite;
}

.visual-area::after{
    width:115%;
    height:70%;

    left:-7%;
    top:15%;

    border:
        1px solid rgba(79,172,254,.20);

    transform:rotate(28deg);

    box-shadow:
        0 0 30px rgba(79,172,254,.06);

    animation:
        ringRotateReverse 30s linear infinite;
}


/* =========================================================
   PHOTO FRAME
========================================================= */

.photo-frame{
    width:100%;

    aspect-ratio:3 / 4;

    position:relative;

    border-radius:30px;

    padding:9px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(123,111,240,.32) 38%,
            rgba(79,172,254,.22) 72%,
            rgba(255,255,255,.08)
        );

    border:1px solid rgba(167,139,250,.55);

    box-shadow:
        0 35px 90px rgba(0,0,0,.58),
        0 20px 55px rgba(108,92,231,.20),
        0 0 45px rgba(79,172,254,.10),
        inset 0 0 0 1px rgba(255,255,255,.06);

    overflow:hidden;

    transform-style:preserve-3d;

    transition:
        transform .65s var(--ease),
        box-shadow .65s var(--ease);
}


/* =========================================================
   PHOTO STATIC GLOSS
========================================================= */

.photo-frame::before{
    content:"";

    position:absolute;
    inset:0;

    border-radius:30px;

    background:
        radial-gradient(
            circle at 10% 8%,
            rgba(255,255,255,.30),
            transparent 17%
        ),
        radial-gradient(
            circle at 88% 12%,
            rgba(98,216,255,.15),
            transparent 22%
        ),
        linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            transparent 35%
        );

    z-index:4;

    pointer-events:none;
}


/* =========================================================
   INNER GLASS
========================================================= */

.photo-frame::after{
    content:"";

    position:absolute;

    inset:8px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.06),
            rgba(15,15,57,.22)
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.025),
        inset 0 0 0 1px rgba(98,216,255,.035);

    z-index:3;

    pointer-events:none;
}


/* =========================================================
   IMAGE
========================================================= */

.photo-frame img{
    position:relative;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:22px;

    z-index:2;

    transition:
        transform .8s var(--ease),
        filter .5s ease;
}


/* =========================================================
   PHOTO SHINE
========================================================= */

.photo-frame .shine{
    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent 25%,
            rgba(255,255,255,.16) 42%,
            rgba(98,216,255,.10) 48%,
            transparent 63%
        );

    transform:translateX(-125%);

    animation:
        shine 7s ease-in-out infinite;
}


/* =========================================================
   PHOTO HOVER
========================================================= */

.photo-frame:hover{
    box-shadow:
        0 48px 110px rgba(0,0,0,.68),
        0 25px 65px rgba(108,92,231,.28),
        0 0 60px rgba(79,172,254,.18),
        inset 0 0 0 1px rgba(255,255,255,.08);
}

.photo-frame:hover img{
    transform:scale(1.035);

    filter:
        saturate(1.04)
        contrast(1.02);
}


/* =========================================================
   FLOATING BADGE
========================================================= */

.image-badge{
    position:absolute;

    right:-25px;
    bottom:35px;

    padding:12px 17px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            rgba(28,25,86,.76),
            rgba(17,17,63,.56)
        );

    border:
        1px solid rgba(167,139,250,.42);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 18px 45px rgba(0,0,0,.42),
        0 0 25px rgba(108,92,231,.13),
        inset 0 0 0 1px rgba(255,255,255,.055);

    display:flex;

    align-items:center;

    gap:10px;

    color:#e8eaff;

    font-size:12px;

    font-weight:800;

    letter-spacing:1px;

    animation:
        badgeFloat 5s ease-in-out infinite;

    z-index:8;
}

.image-badge::before{
    content:"";

    position:absolute;
    inset:1px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 45%
        );

    pointer-events:none;
}

.image-badge .dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 0 5px rgba(98,216,255,.07),
        0 0 18px rgba(98,216,255,.75),
        0 0 35px rgba(108,92,231,.35);

    animation:pulse 2.8s infinite;
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    position:relative;

    animation:
        contentReveal 1s var(--ease) both;
}


/* =========================================================
   CONTENT GLASS AURA
========================================================= */

.content::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    right:-120px;
    top:-100px;

    background:
        radial-gradient(
            circle,
            rgba(108,92,231,.11),
            transparent 68%
        );

    filter:blur(25px);

    pointer-events:none;

    z-index:-1;
}


/* =========================================================
   LABEL
========================================================= */

.small-label{
    display:inline-flex;

    align-items:center;

    gap:10px;

    color:var(--cyan);

    font-size:13px;

    font-weight:800;

    letter-spacing:3px;

    margin-bottom:18px;

    opacity:0;

    animation:
        fadeUp .8s .15s forwards;
}

.small-label::before{
    content:"";

    width:42px;
    height:2px;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--cyan)
        );

    box-shadow:
        0 0 12px rgba(98,216,255,.35);
}


/* =========================================================
   TITLE
========================================================= */

.title{
    position:relative;

    color:#f8f8ff;

    font-size:clamp(48px,7vw,82px);

    line-height:.95;

    font-weight:900;

    letter-spacing:-3px;

    margin-bottom:20px;

    opacity:0;

    text-shadow:
        0 0 12px rgba(255,255,255,.10),
        0 0 28px rgba(108,92,231,.28),
        0 0 55px rgba(79,172,254,.14);

    animation:
        titleReveal 1s .25s var(--ease) forwards;
}


/* =========================================================
   TITLE GLOW
========================================================= */

.title::after{
    content:"PORTFOLIO";

    position:absolute;

    left:3px;
    top:3px;

    z-index:-1;

    color:transparent;

    background:
        linear-gradient(
            90deg,
            rgba(108,92,231,.50),
            rgba(79,172,254,.20),
            transparent 70%
        );

    background-clip:text;
    -webkit-background-clip:text;

    filter:blur(15px);

    opacity:.7;
}


/* =========================================================
   NAME
========================================================= */

.name{
    color:var(--soft);

    font-size:clamp(18px,2vw,25px);

    line-height:1.55;

    margin-bottom:22px;

    opacity:0;

    text-shadow:
        0 0 20px rgba(98,216,255,.06);

    animation:
        fadeUp .8s .45s forwards;
}


/* =========================================================
   SCHOOL
========================================================= */

.school{
    display:inline-flex;

    align-items:center;

    padding:10px 16px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            rgba(61,43,140,.50),
            rgba(15,15,57,.60)
        );

    border:
        1px solid rgba(167,139,250,.34);

    color:#e4e5ff;

    font-weight:800;

    box-shadow:
        0 12px 30px rgba(0,0,0,.28),
        0 0 25px rgba(108,92,231,.10),
        inset 0 0 0 1px rgba(255,255,255,.045);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    position:relative;

    overflow:hidden;

    opacity:0;

    animation:
        fadeUp .8s .6s forwards;
}

.school::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    margin-right:9px;

    background:var(--cyan);

    box-shadow:
        0 0 12px rgba(98,216,255,.8),
        0 0 22px rgba(108,92,231,.45);
}

.school::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.10),
            transparent 35%
        );

    pointer-events:none;
}


/* =========================================================
   TAGS
========================================================= */

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:25px;
}

.tags span{
    position:relative;

    padding:8px 14px;

    border:
        1px solid rgba(167,139,250,.28);

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            rgba(61,43,140,.38),
            rgba(15,15,57,.54)
        );

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    color:#cfd3f1;

    font-size:13px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.20),
        0 0 18px rgba(108,92,231,.06),
        inset 0 0 0 1px rgba(255,255,255,.035);

    transition:
        transform .42s var(--ease),
        background .42s var(--ease),
        color .42s var(--ease),
        box-shadow .42s var(--ease),
        border-color .42s var(--ease);

    opacity:0;

    animation:
        tagReveal .6s forwards;
}

.tags span::after{
    content:"";

    position:absolute;

    inset:1px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 42%
        );

    pointer-events:none;
}

.tags span:nth-child(1){
    animation-delay:.75s;
}

.tags span:nth-child(2){
    animation-delay:.82s;
}

.tags span:nth-child(3){
    animation-delay:.89s;
}

.tags span:nth-child(4){
    animation-delay:.96s;
}

.tags span:hover{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(108,92,231,.72),
            rgba(61,43,140,.70),
            rgba(79,172,254,.48)
        );

    border-color:
        rgba(167,139,250,.62);

    transform:
        translateY(-5px)
        scale(1.04);

    box-shadow:
        0 14px 30px rgba(0,0,0,.32),
        0 0 28px rgba(108,92,231,.25),
        inset 0 0 12px rgba(255,255,255,.06);
}


/* =========================================================
   BUTTON
========================================================= */

.button{
    position:relative;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    margin-top:32px;

    padding:15px 25px;

    border-radius:14px;

    color:white;

    background:
        linear-gradient(

<!-- =======================================================

     3D MOUSE TILT EFFECT
======================================================= -->

<script>

const frame =
    document.querySelector(".photo-frame");

const visualArea =
    document.querySelector(".visual-area");


/* =========================================================
   3D PHOTO TILT
========================================================= */

if(window.innerWidth > 900){

    visualArea.addEventListener(
        "mousemove",
        (e)=>{

            const rect =
                visualArea.getBoundingClientRect();

            const x =
                (e.clientX - rect.left) /
                rect.width;

            const y =
                (e.clientY - rect.top) /
                rect.height;

            const rotateY =
                (x - 0.5) * 10;

            const rotateX =
                (0.5 - y) * 10;

            frame.style.transform = `
                translateY(-10px)
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale(1.015)
            `;

        }
    );


    visualArea.addEventListener(
        "mouseleave",
        ()=>{
            frame.style.transform = "";
        }
    );

}


/* =========================================================
   MOUSE GLOW
========================================================= */

const glow =
    document.createElement("div");


glow.style.position =
    "fixed";

glow.style.width =
    "240px";

glow.style.height =
    "240px";

glow.style.borderRadius =
    "50%";

glow.style.pointerEvents =
    "none";

glow.style.zIndex =
    "1";

glow.style.background =
    `
    radial-gradient(
        circle,
        rgba(108,92,231,.13),
        rgba(79,172,254,.055) 35%,
        transparent 70%
    )
    `;

glow.style.transform =
    "translate(-50%, -50%)";

glow.style.opacity =
    "0";

glow.style.transition =
    "opacity .35s ease";


document.body.appendChild(glow);


document.addEventListener(
    "mousemove",
    (e)=>{

        glow.style.left =
            e.clientX + "px";

        glow.style.top =
            e.clientY + "px";

        glow.style.opacity =
            "1";

    }
);


document.addEventListener(
    "mouseleave",
    ()=>{

        glow.style.opacity =
            "0";

    }
);

</script>

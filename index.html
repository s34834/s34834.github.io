<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Puttikan Ruekraisri</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
    color: #172b40;
    overflow: hidden;

    background:
        radial-gradient(circle at 10% 10%, rgba(21,101,169,.10), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(7,26,53,.09), transparent 30%),
        linear-gradient(135deg, #f8fafc, #edf2f6);
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.container {
    width: min(1050px, 100%);
    display: grid;
    grid-template-columns: .85fr 1.15fr;
    gap: 60px;
    align-items: center;
}

.photo-frame {
    width: min(330px, 80vw);
    aspect-ratio: 3 / 4;
    margin: auto;

    border-radius: 28px;

    background: linear-gradient(145deg, #fff, #e8eef4);

    border: 1px solid rgba(21,101,169,.18);

    box-shadow: 0 20px 55px rgba(7,26,53,.10);

    overflow: hidden;

    transition: .4s ease;
}

.photo-frame:hover {
    transform: translateY(-8px) rotate(-1deg);
    box-shadow: 0 25px 70px rgba(7,26,53,.17);
}

.photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.small-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #1565a9;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;

    margin-bottom: 15px;
}

.small-label::before {
    content: "";
    width: 28px;
    height: 2px;
    background: #1565a9;
}

.title {
    color: #071a35;
    font-size: clamp(42px, 6vw, 72px);
    line-height: 1.05;
    font-weight: 800;
    margin-bottom: 15px;
}

.name {
    color: #496176;
    font-size: clamp(18px, 2vw, 25px);
    line-height: 1.5;
    margin-bottom: 20px;
}

.school {
    display: inline-block;

    padding: 9px 15px;

    border-radius: 10px;

    background: #e9f1f8;

    color: #1565a9;

    font-weight: 700;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 25px;
}

.tags span {
    padding: 7px 12px;

    border: 1px solid rgba(21,101,169,.15);

    border-radius: 20px;

    background: rgba(255,255,255,.75);

    color: #536579;

    font-size: 13px;
}

.button {
    display: inline-block;

    margin-top: 30px;

    padding: 13px 25px;

    border-radius: 12px;

    color: white;

    background: linear-gradient(135deg, #071a35, #1565a9);

    text-decoration: none;

    font-weight: 700;

    box-shadow: 0 10px 25px rgba(7,26,53,.18);

    transition: .3s ease;
}

.button:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(7,26,53,.25);
}

@media (max-width: 900px) {

    body {
        overflow: auto;
    }

    .page {
        padding: 100px 20px 40px;
    }

    .container {
        grid-template-columns: 1fr;
        gap: 30px;
        text-align: center;
    }

    .small-label,
    .tags {
        justify-content: center;
    }
}

@media (max-width: 600px) {

    .photo-frame {
        width: min(260px, 70vw);
    }

    .title {
        font-size: 42px;
    }

    .name {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="container">

        <div class="photo-frame">
            <img src="1000043496.jpg"
                 alt="รูปโปรไฟล์ นายพุฒิกันย์ ฤๅไกรศรี">
        </div>

        <div>

            <div class="small-label">
                PHYSICAL THERAPY
            </div>

            <h1 class="title">
                PORTFOLIO
            </h1>

            <div class="name">
                นายพุฒิกันย์ ฤๅไกรศรี
                <br>
                Puttikan Ruekraisri
            </div>

            <div class="school">
                มัธยมศึกษาปีที่ 6/2
            </div>

            <div class="tags">
                <span>Anatomy</span>
                <span>Movement</span>
                <span>Rehabilitation</span>
                <span>Health Science</span>
            </div>

            <a href="portfolio.html" class="button">
                เข้าสู่ Portfolio →
            </a>

        </div>

    </div>

</div>

</body>
</html>
